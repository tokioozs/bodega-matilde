<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bodega Matilde</title>
<meta name="theme-color" content="#FAF9F5">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAF9F5;
  --surface: #FFFFFF;
  --text: #2B2A26;
  --text-muted: #8A8577;
  --accent: #4A6B4D;
  --accent-soft: #E7EDE7;
  --border: #E5E2D9;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

html, body {
  width: 100%;
  overflow-x: hidden;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
}

.topbar {
  padding: 28px 20px 18px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}

.store-name {
  margin: 0;
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 22px;
  letter-spacing: 0.01em;
}

.store-name span {
  color: var(--accent);
}

.screen {
  max-width: 480px;
  margin: 0 auto;
  padding: 18px 16px 100px;
}

.search-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
}

.search-row .icon-search {
  display: flex;
  color: var(--text-muted);
}

.search-row input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  color: var(--text);
  min-width: 0;
}

.search-row input::placeholder {
  color: var(--text-muted);
}

.lista-personas {
  list-style: none;
  margin: 20px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.persona-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  cursor: pointer;
  transition: border-color 0.15s ease;
}

.persona-item:hover {
  border-color: var(--accent);
}

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 14px;
  flex-shrink: 0;
}

.persona-info {
  flex: 1;
  min-width: 0;
}

.persona-nombre {
  font-weight: 500;
  font-size: 15px;
}

.persona-detalle {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 2px;
}

.persona-total {
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
  white-space: nowrap;
}

.estado-vacio {
  text-align: center;
  color: var(--text-muted);
  font-size: 14px;
  margin-top: 60px;
}

.fab {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(43, 42, 38, 0.18);
}

.fab:focus-visible,
.persona-item:focus-visible,
.search-row input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ===================== Pantalla de detalle de persona ===================== */

.detalle-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.btn-volver {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}

.detalle-nombre {
  font-weight: 600;
  font-size: 17px;
}

.detalle-total {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 2px;
}

.categoria-titulo {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin: 22px 0 10px;
}

.grid-productos {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
}

.producto-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s ease;
}

.producto-card:hover {
  border-color: var(--accent);
}

.producto-imagen-wrap {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 8px;
  overflow: hidden;
  background: var(--accent-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
}

.producto-imagen-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.producto-imagen-wrap svg {
  color: var(--accent);
  opacity: 0.6;
}

.selector-imagen {
  width: 100%;
  height: 120px;
  border: 1px dashed var(--border);
  border-radius: 10px;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  overflow: hidden;
}

.selector-imagen img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.selector-imagen span {
  font-size: 13px;
  color: var(--text-muted);
}

.producto-nombre {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.3;
}

.producto-precio {
  font-size: 13px;
  color: var(--accent);
  margin-top: 6px;
  font-weight: 500;
}

/* ===================== Barra de carrito (fiado en curso) ===================== */

.carrito-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 480px;
  margin: 0 auto;
}

.carrito-cantidad {
  font-size: 12px;
  color: var(--text-muted);
}

.carrito-total {
  font-size: 17px;
  font-weight: 600;
}

/* ===================== Modales / hojas emergentes ===================== */

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(43, 42, 38, 0.35);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 20;
}

.hoja {
  background: var(--bg);
  width: 100%;
  max-width: 480px;
  border-radius: 16px 16px 0 0;
  padding: 22px 20px 26px;
}

.hoja-titulo {
  margin: 0 0 16px;
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-weight: 600;
}

.campo {
  display: block;
  margin-bottom: 14px;
  font-size: 13px;
  color: var(--text-muted);
}

.campo span {
  display: block;
  margin-bottom: 6px;
}

.campo input,
.campo select {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  color: var(--text);
  background: var(--surface);
}

.campo-checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--text);
}

.campo-checkbox input {
  width: auto;
}

.hoja-acciones {
  display: flex;
  gap: 10px;
  margin-top: 6px;
}

.btn-primario,
.btn-secundario {
  flex: 1;
  padding: 12px;
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid transparent;
}

.btn-primario {
  background: var(--accent);
  color: #fff;
}

.btn-secundario {
  background: transparent;
  border-color: var(--border);
  color: var(--text);
}

.toggle-frio {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.chip {
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-size: 13px;
  cursor: pointer;
}

.chip.activo {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 500;
}

.fab-secundario {
  bottom: 90px;
  background: var(--surface);
  color: var(--accent);
  border: 1px solid var(--accent);
}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<header class="topbar">
  <h1 class="store-name">Bodega <span>Matilde</span></h1>
</header>

<!-- ===================== PANTALLA: INICIO ===================== -->
<main class="screen" id="pantallaInicio">
  <div class="search-row">
    <i class="icon-search" aria-hidden="true">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8.5" cy="8.5" r="6"/><line x1="13" y1="13" x2="18" y2="18"/></svg>
    </i>
    <input type="text" id="buscador" placeholder="Buscar persona..." autocomplete="off">
  </div>

  <section aria-label="Lista de personas">
    <ul class="lista-personas" id="listaPersonas"></ul>
  </section>

  <p class="estado-vacio" id="estadoVacio" hidden>No hay personas registradas todavía.</p>
</main>

<button class="fab" id="btnAgregarPersona" aria-label="Agregar persona">
  <svg viewBox="0 0 20 20" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="10" y1="3" x2="10" y2="17"/><line x1="3" y1="10" x2="17" y2="10"/></svg>
</button>

<!-- ===================== PANTALLA: DETALLE DE PERSONA ===================== -->
<main class="screen" id="pantallaPersona" hidden>
  <div class="detalle-header">
    <button class="btn-volver" id="btnVolver" aria-label="Volver">
      <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4l-6 6 6 6"/></svg>
    </button>
    <div>
      <div class="detalle-nombre" id="detallePersonaNombre">Nombre</div>
      <div class="detalle-total" id="detallePersonaTotal">Debe S/ 0.00</div>
    </div>
  </div>

  <div id="listaCategorias"></div>
</main>

<div class="carrito-bar" id="carritoBar" hidden>
  <div>
    <div class="carrito-cantidad" id="carritoCantidad">0 productos</div>
    <div class="carrito-total" id="carritoTotal">S/ 0.00</div>
  </div>
  <button class="btn-primario" id="btnGuardarFiado">Guardar fiado</button>
</div>

<!-- ===================== MODAL: AGREGAR PERSONA ===================== -->
<div class="overlay" id="modalPersona" hidden>
  <div class="hoja">
    <h2 class="hoja-titulo">Agregar persona</h2>
    <label class="campo">
      <span>Nombre</span>
      <input type="text" id="inputNombrePersona" placeholder="Ej. Rosa Gómez">
    </label>
    <div class="hoja-acciones">
      <button class="btn-secundario" data-cerrar="modalPersona">Cancelar</button>
      <button class="btn-primario" id="btnGuardarPersona">Guardar</button>
    </div>
  </div>
</div>

<!-- ===================== MODAL: AGREGAR PRODUCTO NUEVO ===================== -->
<div class="overlay" id="modalProducto" hidden>
  <div class="hoja">
    <h2 class="hoja-titulo">Agregar producto</h2>
    <label class="campo campo-imagen">
      <span>Imagen (opcional)</span>
      <div class="selector-imagen" id="selectorImagen">
        <img id="previewImagen" hidden>
        <span id="placeholderImagen">Toca para elegir una foto</span>
      </div>
      <input type="file" id="inputImagenProducto" accept="image/*" hidden>
    </label>
    <label class="campo">
      <span>Nombre</span>
      <input type="text" id="inputNombreProducto" placeholder="Ej. Inca Kola 500ml">
    </label>
    <label class="campo">
      <span>Categoría</span>
      <select id="selectCategoriaProducto"></select>
    </label>
    <label class="campo">
      <span>Precio base (S/)</span>
      <input type="number" id="inputPrecioBase" step="0.10" placeholder="0.00">
    </label>
    <label class="campo campo-checkbox">
      <input type="checkbox" id="checkTieneFrio">
      <span>Se vende helado a otro precio</span>
    </label>
    <label class="campo" id="campoPrecioFrio" hidden>
      <span>Precio helado (S/)</span>
      <input type="number" id="inputPrecioFrio" step="0.10" placeholder="0.00">
    </label>
    <div class="hoja-acciones">
      <button class="btn-secundario" data-cerrar="modalProducto">Cancelar</button>
      <button class="btn-primario" id="btnGuardarProducto">Guardar</button>
    </div>
  </div>
</div>

<!-- ===================== MODAL: AGREGAR AL FIADO ===================== -->
<div class="overlay" id="modalCantidad" hidden>
  <div class="hoja">
    <h2 class="hoja-titulo" id="modalCantidadNombre">Producto</h2>

    <div class="toggle-frio" id="toggleFrio" hidden>
      <button class="chip activo" data-tipo="normal">Normal</button>
      <button class="chip" data-tipo="frio">Helado</button>
    </div>

    <label class="campo">
      <span>Cantidad</span>
      <input type="number" id="inputCantidad" value="1" min="0.1" step="0.1">
    </label>
    <label class="campo">
      <span>Precio (S/)</span>
      <input type="number" id="inputPrecioEditable" step="0.10">
    </label>
    <div class="hoja-acciones">
      <button class="btn-secundario" data-cerrar="modalCantidad">Cancelar</button>
      <button class="btn-primario" id="btnAgregarAlCarrito">Agregar</button>
    </div>
  </div>
</div>

<button class="fab fab-secundario" id="btnAgregarProducto" hidden aria-label="Agregar producto nuevo">
  <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="10" y1="3" x2="10" y2="17"/><line x1="3" y1="10" x2="17" y2="10"/></svg>
</button>

<script>
// =========================================================
// CONFIGURACIÓN DE SUPABASE
// Pega aquí la URL y la clave "anon public" de tu proyecto
// (Supabase → Settings → API)
// =========================================================
const SUPABASE_URL = "https://stjrahfzktosterzkoxv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HQmsRjO82v9X3Ync8dHkjg_r35lcPYs";

let supabase = null;
try {
  if (window.supabase && window.supabase.createClient) {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } else {
    console.error("No se cargó la librería de Supabase (revisa tu conexión a internet o si algo bloquea cdn.jsdelivr.net).");
  }
} catch (err) {
  console.error("Error al iniciar Supabase:", err);
}

function supabaseListo() {
  if (!supabase) {
    mostrarError("No hay conexión con Supabase todavía. Revisa tu internet y recarga la página.");
    return false;
  }
  return true;
}

// =========================================================
// Estado de la app (se llena al cargar desde Supabase)
// =========================================================
let categoriasCompletas = []; // [{id, nombre}]
let categorias = [];          // solo nombres, para agrupar en pantalla
let productos = [];           // [{id, nombre, categoria, precioBase, precioFrio, imagen}]
let personas = [];            // [{id, nombre, total, ultimoFiado}]

let imagenProductoSeleccionada = null;   // dataURL para la vista previa
let archivoImagenSeleccionado = null;    // archivo real que se sube a Storage

// Estado de la pantalla de detalle
let personaActual = null;
let carritoActual = []; // { productoId, nombre, cantidad, precioUsado }
let productoSeleccionado = null;
let tipoPrecioSeleccionado = "normal";

// =========================================================
// Referencias del DOM
// =========================================================
const pantallaInicio = document.getElementById("pantallaInicio");
const pantallaPersona = document.getElementById("pantallaPersona");
const listaEl = document.getElementById("listaPersonas");
const estadoVacioEl = document.getElementById("estadoVacio");
const buscadorEl = document.getElementById("buscador");

const btnAgregarPersona = document.getElementById("btnAgregarPersona");
const btnAgregarProducto = document.getElementById("btnAgregarProducto");
const btnVolver = document.getElementById("btnVolver");

const detallePersonaNombre = document.getElementById("detallePersonaNombre");
const detallePersonaTotal = document.getElementById("detallePersonaTotal");
const listaCategorias = document.getElementById("listaCategorias");

const carritoBar = document.getElementById("carritoBar");
const carritoCantidad = document.getElementById("carritoCantidad");
const carritoTotal = document.getElementById("carritoTotal");
const btnGuardarFiado = document.getElementById("btnGuardarFiado");

// =========================================================
// Utilidades
// =========================================================
function iniciales(nombre) {
  return nombre.split(" ").slice(0, 2).map((p) => p[0]).join("").toUpperCase();
}

function soles(monto) {
  return "S/ " + Number(monto).toFixed(2);
}

function formatearFecha(fechaISO) {
  if (!fechaISO) return null;
  const hoy = new Date().toISOString().slice(0, 10);
  if (fechaISO === hoy) return "hoy";
  const dias = Math.round((new Date(hoy) - new Date(fechaISO)) / 86400000);
  return dias === 1 ? "hace 1 día" : `hace ${dias} días`;
}

function iconoCajita() {
  return `<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6">
    <path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>
  </svg>`;
}

function abrirModal(id) {
  document.getElementById(id).hidden = false;
}

function cerrarModal(id) {
  document.getElementById(id).hidden = true;
}

document.querySelectorAll("[data-cerrar]").forEach((btn) => {
  btn.addEventListener("click", () => cerrarModal(btn.dataset.cerrar));
});

function mostrarError(mensaje, error) {
  console.error(mensaje, error);
  alert(mensaje + (error?.message ? "\n" + error.message : ""));
}

// =========================================================
// Carga inicial de datos desde Supabase
// =========================================================
async function cargarDatosIniciales() {
  if (!supabaseListo()) {
    estadoVacioEl.hidden = false;
    estadoVacioEl.textContent = "No hay conexión con Supabase. Revisa tu internet y recarga.";
    return;
  }

  estadoVacioEl.hidden = false;
  estadoVacioEl.textContent = "Cargando...";

  const [resCategorias, resProductos, resPersonas] = await Promise.all([
    supabase.from("categorias").select("*").order("id"),
    supabase.from("productos").select("*").order("nombre"),
    supabase.from("personas_con_deuda").select("*").order("nombre"),
  ]);

  if (resCategorias.error || resProductos.error || resPersonas.error) {
    mostrarError(
      "No se pudo conectar con Supabase. Revisa la URL y la clave en app.js.",
      resCategorias.error || resProductos.error || resPersonas.error
    );
    estadoVacioEl.textContent = "No se pudo conectar con la base de datos.";
    return;
  }

  categoriasCompletas = resCategorias.data;
  categorias = categoriasCompletas.map((c) => c.nombre);

  productos = resProductos.data.map((p) => ({
    id: p.id,
    nombre: p.nombre,
    categoria: categoriasCompletas.find((c) => c.id === p.categoria_id)?.nombre || "Otros",
    precioBase: Number(p.precio_base),
    precioFrio: p.precio_frio !== null ? Number(p.precio_frio) : null,
    imagen: p.imagen_url,
  }));

  personas = resPersonas.data.map((p) => ({
    id: p.id,
    nombre: p.nombre,
    total: Number(p.total),
    ultimoFiado: formatearFecha(p.ultimo_fiado),
  }));

  renderListaPersonas(personas);
}

// =========================================================
// PANTALLA: Inicio (lista de personas)
// =========================================================
function renderListaPersonas(datos) {
  listaEl.innerHTML = "";

  if (datos.length === 0) {
    estadoVacioEl.hidden = false;
    estadoVacioEl.textContent = "No hay personas registradas todavía.";
    return;
  }
  estadoVacioEl.hidden = true;

  datos.forEach((persona) => {
    const li = document.createElement("li");
    li.className = "persona-item";

    const detalle = persona.ultimoFiado
      ? `Último fiado: ${persona.ultimoFiado}`
      : "Sin fiados registrados";

    li.innerHTML = `
      <div class="avatar">${iniciales(persona.nombre)}</div>
      <div class="persona-info">
        <div class="persona-nombre">${persona.nombre}</div>
        <div class="persona-detalle">${detalle}</div>
      </div>
      <div class="persona-total">${persona.total > 0 ? soles(persona.total) : ""}</div>
    `;

    li.addEventListener("click", () => abrirPantallaPersona(persona));
    listaEl.appendChild(li);
  });
}

buscadorEl.addEventListener("input", (e) => {
  const texto = e.target.value.trim().toLowerCase();
  renderListaPersonas(personas.filter((p) => p.nombre.toLowerCase().includes(texto)));
});

// =========================================================
// Modal: Agregar persona
// =========================================================
btnAgregarPersona.addEventListener("click", () => {
  document.getElementById("inputNombrePersona").value = "";
  abrirModal("modalPersona");
});

document.getElementById("btnGuardarPersona").addEventListener("click", async (e) => {
  const nombre = document.getElementById("inputNombrePersona").value.trim();
  if (!nombre || !supabaseListo()) return;

  e.target.disabled = true;
  const { data, error } = await supabase.from("personas").insert({ nombre }).select().single();
  e.target.disabled = false;

  if (error) return mostrarError("No se pudo guardar la persona.", error);

  personas.push({ id: data.id, nombre: data.nombre, total: 0, ultimoFiado: null });
  renderListaPersonas(personas);
  cerrarModal("modalPersona");
});

// =========================================================
// PANTALLA: Detalle de persona
// =========================================================
function abrirPantallaPersona(persona) {
  personaActual = persona;
  carritoActual = [];

  pantallaInicio.hidden = true;
  pantallaPersona.hidden = false;
  btnAgregarPersona.hidden = true;
  btnAgregarProducto.hidden = false;

  detallePersonaNombre.textContent = persona.nombre;
  detallePersonaTotal.textContent = `Debe ${soles(persona.total)}`;

  renderProductosPorCategoria();
  actualizarCarritoBar();
}

btnVolver.addEventListener("click", () => {
  pantallaPersona.hidden = true;
  pantallaInicio.hidden = false;
  btnAgregarPersona.hidden = false;
  btnAgregarProducto.hidden = true;
  renderListaPersonas(personas);
});

function renderProductosPorCategoria() {
  listaCategorias.innerHTML = "";

  categorias.forEach((cat) => {
    const productosCat = productos.filter((p) => p.categoria === cat);
    if (productosCat.length === 0) return;

    const titulo = document.createElement("div");
    titulo.className = "categoria-titulo";
    titulo.textContent = cat;
    listaCategorias.appendChild(titulo);

    const grid = document.createElement("div");
    grid.className = "grid-productos";

    productosCat.forEach((producto) => {
      const card = document.createElement("button");
      card.className = "producto-card";
      const contenidoImagen = producto.imagen
        ? `<img src="${producto.imagen}" alt="">`
        : iconoCajita();
      card.innerHTML = `
        <div class="producto-imagen-wrap">${contenidoImagen}</div>
        <div class="producto-nombre">${producto.nombre}</div>
        <div class="producto-precio">${soles(producto.precioBase)}</div>
      `;
      card.addEventListener("click", () => abrirModalCantidad(producto));
      grid.appendChild(card);
    });

    listaCategorias.appendChild(grid);
  });
}

// =========================================================
// Modal: Agregar al fiado (cantidad y precio)
// =========================================================
function abrirModalCantidad(producto) {
  productoSeleccionado = producto;
  tipoPrecioSeleccionado = "normal";

  document.getElementById("modalCantidadNombre").textContent = producto.nombre;
  document.getElementById("inputCantidad").value = 1;
  document.getElementById("inputPrecioEditable").value = producto.precioBase.toFixed(2);

  const toggleFrio = document.getElementById("toggleFrio");
  if (producto.precioFrio) {
    toggleFrio.hidden = false;
    toggleFrio.querySelectorAll(".chip").forEach((chip) => {
      chip.classList.toggle("activo", chip.dataset.tipo === "normal");
    });
  } else {
    toggleFrio.hidden = true;
  }

  abrirModal("modalCantidad");
}

document.querySelectorAll(".chip[data-tipo]").forEach((chip) => {
  chip.addEventListener("click", () => {
    tipoPrecioSeleccionado = chip.dataset.tipo;
    document.querySelectorAll(".chip[data-tipo]").forEach((c) => c.classList.toggle("activo", c === chip));

    const precio = tipoPrecioSeleccionado === "frio"
      ? productoSeleccionado.precioFrio
      : productoSeleccionado.precioBase;
    document.getElementById("inputPrecioEditable").value = precio.toFixed(2);
  });
});

document.getElementById("btnAgregarAlCarrito").addEventListener("click", () => {
  const cantidad = parseFloat(document.getElementById("inputCantidad").value) || 1;
  const precioUsado = parseFloat(document.getElementById("inputPrecioEditable").value) || 0;

  carritoActual.push({
    productoId: productoSeleccionado.id,
    nombre: productoSeleccionado.nombre,
    cantidad,
    precioUsado,
  });

  actualizarCarritoBar();
  cerrarModal("modalCantidad");
});

function actualizarCarritoBar() {
  if (carritoActual.length === 0) {
    carritoBar.hidden = true;
    return;
  }
  carritoBar.hidden = false;

  const totalItems = carritoActual.reduce((acc, item) => acc + item.cantidad, 0);
  const totalSoles = carritoActual.reduce((acc, item) => acc + item.cantidad * item.precioUsado, 0);

  carritoCantidad.textContent = `${totalItems} producto${totalItems !== 1 ? "s" : ""}`;
  carritoTotal.textContent = soles(totalSoles);
}

btnGuardarFiado.addEventListener("click", async () => {
  if (!personaActual || carritoActual.length === 0 || !supabaseListo()) return;

  btnGuardarFiado.disabled = true;
  btnGuardarFiado.textContent = "Guardando...";

  // 1. Crear la cabecera del fiado
  const { data: fiado, error: errorFiado } = await supabase
    .from("fiados")
    .insert({ persona_id: personaActual.id })
    .select()
    .single();

  if (errorFiado) {
    btnGuardarFiado.disabled = false;
    btnGuardarFiado.textContent = "Guardar fiado";
    return mostrarError("No se pudo guardar el fiado.", errorFiado);
  }

  // 2. Guardar el detalle (cada producto llevado)
  const detalles = carritoActual.map((item) => ({
    fiado_id: fiado.id,
    producto_id: item.productoId,
    cantidad: item.cantidad,
    precio_usado: item.precioUsado,
  }));

  const { error: errorDetalle } = await supabase.from("detalle_fiado").insert(detalles);

  btnGuardarFiado.disabled = false;
  btnGuardarFiado.textContent = "Guardar fiado";

  if (errorDetalle) return mostrarError("No se pudo guardar el detalle del fiado.", errorDetalle);

  // 3. Actualizar el total en pantalla (optimista, sin recargar todo)
  const totalFiado = carritoActual.reduce((acc, item) => acc + item.cantidad * item.precioUsado, 0);
  personaActual.total += totalFiado;
  personaActual.ultimoFiado = "hoy";

  detallePersonaTotal.textContent = `Debe ${soles(personaActual.total)}`;
  carritoActual = [];
  actualizarCarritoBar();
});

// =========================================================
// Modal: Agregar producto nuevo (con imagen)
// =========================================================
function llenarSelectCategorias() {
  const select = document.getElementById("selectCategoriaProducto");
  select.innerHTML = categorias.map((c) => `<option value="${c}">${c}</option>`).join("");
}

const selectorImagen = document.getElementById("selectorImagen");
const inputImagenProducto = document.getElementById("inputImagenProducto");
const previewImagen = document.getElementById("previewImagen");
const placeholderImagen = document.getElementById("placeholderImagen");

selectorImagen.addEventListener("click", () => inputImagenProducto.click());

inputImagenProducto.addEventListener("change", (e) => {
  const archivo = e.target.files[0];
  if (!archivo) return;

  archivoImagenSeleccionado = archivo;

  const lector = new FileReader();
  lector.onload = () => {
    imagenProductoSeleccionada = lector.result;
    previewImagen.src = imagenProductoSeleccionada;
    previewImagen.hidden = false;
    placeholderImagen.hidden = true;
  };
  lector.readAsDataURL(archivo);
});

btnAgregarProducto.addEventListener("click", () => {
  document.getElementById("inputNombreProducto").value = "";
  document.getElementById("inputPrecioBase").value = "";
  document.getElementById("checkTieneFrio").checked = false;
  document.getElementById("inputPrecioFrio").value = "";
  document.getElementById("campoPrecioFrio").hidden = true;
  imagenProductoSeleccionada = null;
  archivoImagenSeleccionado = null;
  previewImagen.hidden = true;
  previewImagen.src = "";
  placeholderImagen.hidden = false;
  inputImagenProducto.value = "";
  llenarSelectCategorias();
  abrirModal("modalProducto");
});

document.getElementById("checkTieneFrio").addEventListener("change", (e) => {
  document.getElementById("campoPrecioFrio").hidden = !e.target.checked;
});

document.getElementById("btnGuardarProducto").addEventListener("click", async (e) => {
  const nombre = document.getElementById("inputNombreProducto").value.trim();
  const categoriaNombre = document.getElementById("selectCategoriaProducto").value;
  const precioBase = parseFloat(document.getElementById("inputPrecioBase").value);
  const tieneFrio = document.getElementById("checkTieneFrio").checked;
  const precioFrio = tieneFrio ? parseFloat(document.getElementById("inputPrecioFrio").value) : null;

  if (!nombre || isNaN(precioBase) || !supabaseListo()) return;

  const categoriaObj = categoriasCompletas.find((c) => c.nombre === categoriaNombre);

  e.target.disabled = true;
  e.target.textContent = "Guardando...";

  // 1. Si eligió una imagen, subirla primero a Supabase Storage
  let imagenUrl = null;
  if (archivoImagenSeleccionado) {
    const nombreArchivo = `${Date.now()}_${archivoImagenSeleccionado.name}`;
    const { error: errorSubida } = await supabase.storage
      .from("productos-imagenes")
      .upload(nombreArchivo, archivoImagenSeleccionado);

    if (errorSubida) {
      mostrarError("No se pudo subir la imagen, se guardará el producto sin foto.", errorSubida);
    } else {
      const { data } = supabase.storage.from("productos-imagenes").getPublicUrl(nombreArchivo);
      imagenUrl = data.publicUrl;
    }
  }

  // 2. Guardar el producto
  const { data, error } = await supabase
    .from("productos")
    .insert({
      nombre,
      categoria_id: categoriaObj.id,
      precio_base: precioBase,
      precio_frio: precioFrio,
      imagen_url: imagenUrl,
    })
    .select()
    .single();

  e.target.disabled = false;
  e.target.textContent = "Guardar";

  if (error) return mostrarError("No se pudo guardar el producto.", error);

  productos.push({
    id: data.id,
    nombre: data.nombre,
    categoria: categoriaNombre,
    precioBase: Number(data.precio_base),
    precioFrio: data.precio_frio !== null ? Number(data.precio_frio) : null,
    imagen: data.imagen_url,
  });

  renderProductosPorCategoria();
  cerrarModal("modalProducto");
});

// =========================================================
// Inicio
// =========================================================
cargarDatosIniciales();

</script>
</body>
</html>
